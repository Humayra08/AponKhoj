services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: aponkhoj_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-aponkhoj}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_USER: ${DB_USERNAME:-aponkhoj_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - aponkhoj_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AI Embeddings microservice (chatbot: computes text embeddings only —
  # the actual vector store is Supabase Postgres/pgvector, queried directly
  # from Laravel; face embeddings land in Phase 2)
  ai-embeddings:
    build:
      context: ./services/ai-embeddings
      dockerfile: Dockerfile
    container_name: aponkhoj_ai_embeddings
    restart: unless-stopped
    networks:
      - aponkhoj_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # PHP & Apache Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_URL: ${APP_URL:-http://localhost}
    container_name: aponkhoj_app
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      db:
        condition: service_healthy
      ai-embeddings:
        condition: service_healthy
    networks:
      - aponkhoj_network
    volumes:
      - ./server:/var/www/html                          
      - vendor_data:/var/www/html/vendor      
      - ./server/storage/logs:/var/www/html/storage/logs
      - ./server/storage/app:/var/www/html/storage/app

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: aponkhoj_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      UPLOAD_LIMIT: 50M
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - aponkhoj_network

networks:
  aponkhoj_network:
    driver: bridge

volumes:
  db_data:
    driver: local
  vendor_data:
    driver: local